services:
  postgres:
    image: postgres:16-alpine
    container_name: grocereal-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: grocereal
    ports:
      - "5432:5432"
    volumes:
      - grocereal_pgdata:/var/lib/postgresql/data

volumes:
  grocereal_pgdata:
